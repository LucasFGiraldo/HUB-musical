<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUB Musical</title>
<style>
  :root { --bg: #0b0b0d; --panel: #141418; --fg: #f2f2f2; --muted: #8a8a92; --bar: #2a2a30;
    --accent: #1db954; --warn: #e5a50a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .hidden { display: none !important; }

  /* Tocando agora */
  #now { height: 100%; display: flex; align-items: center; justify-content: center; gap: 4vw; padding: 4vw; }
  #cover { width: min(42vw, 70vh); aspect-ratio: 1; object-fit: cover; border-radius: 12px;
    background: var(--bar); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #info { flex: 1; min-width: 0; max-width: 46vw; }
  #title { font-size: clamp(24px, 4.5vw, 64px); font-weight: 700; margin: 0 0 .2em; line-height: 1.1; }
  #artists { font-size: clamp(16px, 2.6vw, 34px); opacity: .85; margin: 0 0 .3em; }
  #album { font-size: clamp(13px, 1.8vw, 22px); color: var(--muted); margin: 0 0 1.5em; }
  .progress { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); }
  .times { display: flex; justify-content: space-between; color: var(--muted);
    font-size: clamp(12px, 1.4vw, 18px); margin-top: .5em; font-variant-numeric: tabular-nums; }
  #paused { color: var(--muted); font-size: clamp(12px, 1.4vw, 18px); margin-top: 1em; }
  #source { display: inline-block; color: var(--muted); border: 1px solid var(--bar); border-radius: 999px;
    padding: .2em .8em; font-size: clamp(11px, 1.2vw, 15px); margin: 0 0 1.2em; }

  button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--bar);
    border-radius: 8px; padding: .4em 1em; cursor: pointer; }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--bar); border-radius: 12px;
    padding: 1.5em; width: min(92vw, 440px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 1em; font-size: 18px; }
  dialog label { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 1em;
    margin-bottom: .8em; font-size: 14px; }
  dialog label small { display: block; color: var(--muted); font-size: 12px; }
  dialog input[type=number] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--bar);
    border-radius: 6px; padding: .3em .5em; width: 100%; }
  dialog .actions { display: flex; justify-content: flex-end; gap: .6em; margin-top: 1.2em; }
  #settings-msg { color: var(--warn); font-size: 13px; min-height: 1.2em; margin: .5em 0 0; }

  /* Painel de espera */
  #idle { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 2.5vh; padding: 3vh 3vw; }
  #idle header { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; }
  #clock { font-size: clamp(40px, 8vw, 110px); font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  #date { color: var(--muted); font-size: clamp(14px, 1.8vw, 22px); margin-top: .3em; }
  #date::first-letter { text-transform: uppercase; }
  .chips { display: flex; gap: .6em; flex-wrap: wrap; justify-content: flex-end; }
  .chip { background: var(--panel); border-radius: 999px; padding: .35em .9em; font-size: clamp(12px, 1.3vw, 16px);
    color: var(--muted); display: flex; align-items: center; gap: .45em; }
  .chip::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: var(--muted); }
  .chip.ok::before { background: var(--accent); }
  .chip.warn::before { background: var(--warn); }
  .content { display: grid; grid-template-columns: 1.1fr 1fr; gap: 3vw; min-height: 0; }
  #mosaic { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 8px;
    align-content: start; min-height: 0; }
  #mosaic img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: var(--bar); }
  .side { display: flex; flex-direction: column; gap: 2.5vh; min-height: 0; overflow: hidden; }
  .side h2 { font-size: clamp(13px, 1.4vw, 17px); font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em; margin: 0 0 .8em; }
  #recent, #top { list-style: none; margin: 0; padding: 0; }
  #recent li { display: grid; grid-template-columns: 44px 1fr auto; gap: .8em; align-items: center; padding: .35em 0; }
  #recent img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; background: var(--bar); }
  .t { font-size: clamp(13px, 1.4vw, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a { font-size: clamp(12px, 1.2vw, 15px); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .when { font-size: clamp(11px, 1.1vw, 14px); color: var(--muted); white-space: nowrap; }
  #top li { display: flex; justify-content: space-between; padding: .3em 0; font-size: clamp(13px, 1.4vw, 17px); }
  #top li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: clamp(13px, 1.4vw, 17px); grid-column: 1 / -1; margin: 0; }
  #recent li.empty { display: block; }
  #idle footer { color: var(--muted); font-size: clamp(11px, 1.1vw, 14px); display: flex; gap: 2em; flex-wrap: wrap;
    border-top: 1px solid var(--bar); padding-top: 1.2vh; }

  @media (max-aspect-ratio: 1/1) {
    #now { flex-direction: column; text-align: center; }
    #cover { width: min(80vw, 50vh); }
    #info { max-width: 90vw; }
    .content { grid-template-columns: 1fr; }
    #mosaic { grid-template-columns: repeat(6, 1fr); }
  }
</style>
</head>
<body>
<section id="now" class="hidden">
  <img id="cover" alt="">
  <div id="info">
    <h1 id="title"></h1>
    <p id="artists"></p>
    <p id="album"></p>
    <p id="source"></p>
    <div id="progress-wrap">
      <div class="progress"><div id="bar"></div></div>
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
    </div>
    <p id="paused" class="hidden">Pausado</p>
  </div>
</section>

<section id="idle">
  <header>
    <div>
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div class="chips">
      <span id="chip-spotify" class="chip">Spotify</span>
      <span id="chip-server" class="chip">Servidor</span>
    </div>
  </header>
  <div class="content">
    <div id="mosaic"></div>
    <div class="side">
      <div>
        <h2>Tocadas recentemente</h2>
        <ul id="recent"></ul>
      </div>
      <div>
        <h2>Mais ouvidos · 30 dias</h2>
        <ol id="top"></ol>
      </div>
    </div>
  </div>
  <footer>
    <span id="p-poll">Consulta ao Spotify: –</span>
    <span id="p-mic">Microfone: –</span>
    <span id="p-total">Músicas registradas: –</span>
    <span id="p-uptime">Servidor no ar desde –</span>
    <button id="open-settings" type="button">Parâmetros</button>
  </footer>
</section>

<dialog id="settings">
  <form id="settings-form" method="dialog">
    <h2>Parâmetros do microfone</h2>
    <label>Microfone ligado <input type="checkbox" name="mic_enabled"></label>
    <label><span>Confiança mínima de música<small>0,05 a 0,95 — maior ignora mais barulho</small></span>
      <input type="number" name="music_threshold" min="0.05" max="0.95" step="0.05"></label>
    <label><span>Segundos de música antes de identificar<small>1 a 30</small></span>
      <input type="number" name="music_seconds" min="1" max="30" step="1"></label>
    <label><span>Segundos de áudio enviados ao Shazam<small>3 a 15</small></span>
      <input type="number" name="clip_seconds" min="3" max="15" step="1"></label>
    <label><span>Conferir troca de faixa a cada (s)<small>10 a 300</small></span>
      <input type="number" name="recheck_seconds" min="10" max="300" step="5"></label>
    <label><span>Tirar da tela após silêncio de (s)<small>5 a 120</small></span>
      <input type="number" name="silence_seconds" min="5" max="120" step="5"></label>
    <p id="settings-msg"></p>
    <div class="actions">
      <button type="button" id="close-settings">Cancelar</button>
      <button type="submit" id="save-settings">Salvar</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const IDLE_AFTER_PAUSE_MS = 30000;  // pausado por mais que isso → painel de espera

let track = null;       // último estado vindo do servidor
let fetchedAt = 0;      // quando chegou, para avançar a barra localmente
let pausedSince = null;

function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  if (min < 24 * 60) return `há ${Math.round(min / 60)} h`;
  return new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function show(view) {
  $("now").classList.toggle("hidden", view !== "now");
  $("idle").classList.toggle("hidden", view !== "idle");
}

/* ---------- Tocando agora ---------- */

function renderProgress() {
  if (!track || !track.title || !track.duration_ms) return;
  const progress = track.playing
    ? Math.min(track.duration_ms, track.progress_ms + (Date.now() - fetchedAt))
    : track.progress_ms;
  $("bar").style.width = `${(progress / track.duration_ms) * 100}%`;
  $("elapsed").textContent = fmt(progress);
}

function applyNow(data) {
  if (!data.title) { track = null; pausedSince = null; show("idle"); return; }

  if (data.playing) pausedSince = null;
  else if (pausedSince === null) pausedSince = Date.now();

  if (!track || track.cover !== data.cover) $("cover").src = data.cover || "";
  $("title").textContent = data.title;
  $("artists").textContent = data.artists.join(", ");
  $("album").textContent = [data.album, data.release_date && data.release_date.slice(0, 4)]
    .filter(Boolean).join(" · ");
  $("source").textContent = data.source === "mic" ? "Ouvido pelo microfone" : "Spotify";
  // O Shazam não informa duração nem progresso
  $("progress-wrap").classList.toggle("hidden", !data.duration_ms);
  $("duration").textContent = fmt(data.duration_ms);
  $("paused").classList.toggle("hidden", data.playing);
  track = data;
  fetchedAt = Date.now();
  renderProgress();

  updateView();
}

function updateView() {
  if (!track) { show("idle"); return; }
  const idle = pausedSince !== null && Date.now() - pausedSince > IDLE_AFTER_PAUSE_MS;
  show(idle ? "idle" : "now");
}

// Eventos em tempo real do servidor; o navegador reconecta sozinho se cair
function connect() {
  const es = new EventSource("/api/stream");
  es.addEventListener("open", () => setChip("chip-server", "ok", "Servidor"));
  es.addEventListener("now", (e) => applyNow(JSON.parse(e.data)));
  es.addEventListener("history", () => refreshPanel());
  es.addEventListener("error", () => setChip("chip-server", "warn", "Reconectando…"));
}

/* ---------- Painel de espera ---------- */

function setChip(id, cls, text) {
  const c = $(id);
  c.className = `chip ${cls}`;
  c.textContent = text;
}

function tickClock() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
}

async function refreshPanel() {
  try {
    const [history, stats, status] = await Promise.all([
      fetch("/api/history?limit=60").then((r) => r.json()),
      fetch("/api/stats").then((r) => r.json()),
      fetch("/api/status").then((r) => r.json()),
    ]);

    // Mosaico: capas distintas mais recentes
    const mosaic = $("mosaic");
    mosaic.replaceChildren();
    const covers = [...new Set(history.map((h) => h.cover).filter(Boolean))].slice(0, 16);
    for (const src of covers) { const img = el("img"); img.src = src; img.alt = ""; mosaic.append(img); }
    if (!covers.length) mosaic.append(el("p", "empty", "As capas aparecem aqui conforme você ouve músicas."));

    // Lista das últimas músicas
    const recent = $("recent");
    recent.replaceChildren();
    for (const h of history.slice(0, 7)) {
      const li = el("li");
      const img = el("img"); img.src = h.cover || ""; img.alt = "";
      const text = el("div");
      text.style.minWidth = "0";
      text.append(el("div", "t", h.title),
        el("div", "a", h.source === "mic" ? `${h.artists} · microfone` : h.artists));
      li.append(img, text, el("span", "when", ago(h.played_at)));
      recent.append(li);
    }
    if (!history.length) recent.append(el("li", "empty", "Nenhuma música registrada ainda."));

    // Mais ouvidos
    const top = $("top");
    top.replaceChildren();
    for (const t of stats.top_artists) {
      const li = el("li");
      li.append(el("span", "", t.artists), el("span", "", `${t.plays}×`));
      top.append(li);
    }
    if (!stats.top_artists.length) top.append(el("li", "empty", "Sem dados ainda."));

    // Estado e parâmetros
    if (!status.spotify_authorized) setChip("chip-spotify", "warn", "Spotify não conectado");
    else if (status.last_error) setChip("chip-spotify", "warn", `Spotify: ${status.last_error}`);
    else setChip("chip-spotify", "ok", "Spotify");
    $("p-poll").textContent = `Consulta ao Spotify: a cada ${status.poll_seconds} s`;
    const mic = status.mic;
    $("p-mic").textContent = `Microfone: ${mic.error ? `erro (${mic.error})` : mic.state}` +
      (mic.music_score !== null ? ` · música ${Math.round(mic.music_score * 100)}%` : "") +
      (mic.last_result ? ` · último: ${mic.last_result}` : "");
    $("p-total").textContent = `Músicas registradas: ${stats.total_plays}`;
    $("p-uptime").textContent = `Servidor no ar desde ${new Date(status.started_at * 1000)
      .toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}`;
  } catch {
    setChip("chip-server", "warn", "Servidor indisponível");
  }
}

/* ---------- Parâmetros ---------- */

const form = $("settings-form");

$("open-settings").addEventListener("click", async () => {
  const s = await fetch("/api/settings").then((r) => r.json());
  for (const [k, v] of Object.entries(s)) {
    const input = form.elements[k];
    if (!input) continue;
    if (input.type === "checkbox") input.checked = v; else input.value = v;
  }
  $("settings-msg").textContent = "";
  $("settings").showModal();
});

$("close-settings").addEventListener("click", () => $("settings").close());

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {};
  for (const input of form.querySelectorAll("input")) {
    body[input.name] = input.type === "checkbox" ? input.checked : Number(input.value);
  }
  const res = await fetch("/api/settings", {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (res.ok) { $("settings").close(); refreshPanel(); return; }
  const err = await res.json().catch(() => ({}));
  $("settings-msg").textContent = Array.isArray(err.detail)
    ? `Valor inválido em: ${err.detail.map((d) => d.loc.at(-1)).join(", ")}`
    : "Não foi possível salvar";
});

tickClock();
connect();
refreshPanel();
setInterval(tickClock, 1000);
setInterval(renderProgress, 250);
setInterval(updateView, 1000);      // troca para o painel quando a pausa passa de 30 s
setInterval(refreshPanel, 10000);   // atualiza "há X min" e o status do microfone
</script>
</body>
</html>
