<!doctype html>
<html lang="pt-BR" translate="no" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUB Musical</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<script>if (new URLSearchParams(location.search).has("quiosque")) document.documentElement.classList.add("kiosk");</script>
<style>
  @font-face {
    font-family: "Bricolage Grotesque";
    src: url("fonts/BricolageGrotesque.ttf") format("truetype");
    font-weight: 200 800;
    font-stretch: 75% 100%;
    font-display: swap;
  }

  /* Dia: pedra e argila. Noite: musgo e linho. Nenhum branco, nenhum amarelo. */
  :root {
    --ease: cubic-bezier(.22, .61, .36, 1);
    --fade: 900ms;
  }
  :root[data-theme="day"] {
    --bg: #cfc9b9;
    --ink: #2b261f;
    --muted: #5f5849;
    --faint: rgba(43, 38, 31, .14);
    --spotify: #178b40;
    --rust: #a4532f;
    --shadow: rgba(52, 42, 28, .34);
    --veil: rgba(207, 201, 185, .72);
    --glow-opacity: .78;
  }
  :root[data-theme="night"] {
    --bg: #181a15;
    --ink: #ddd6c4;
    --muted: #8c8672;
    --faint: rgba(221, 214, 196, .12);
    --spotify: #1db954;
    --rust: #c0663f;
    --shadow: rgba(0, 0, 0, .55);
    --veil: rgba(24, 26, 21, .7);
    --glow-opacity: .7;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* O cursor só some na tela dedicada (o quiosque abre a página com ?quiosque) */
  html.kiosk, html.kiosk body { cursor: none; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-optical-sizing: auto;
    transition: background-color 2s var(--ease), color 2s var(--ease);
  }
  svg { display: block; }

  /* A que sai some primeiro; a que entra espera um instante, para as duas não se sobreporem */
  .view {
    position: absolute; inset: 0;
    opacity: 0; visibility: hidden;
    transition: opacity 500ms var(--ease), visibility 0s linear 500ms;
  }
  .view.on {
    opacity: 1; visibility: visible;
    transition: opacity var(--fade) var(--ease) 380ms, visibility 0s linear 0s;
  }

  /* ---------- Tocando agora ---------- */

  /* Fundo com as cores da capa: três manchas de luz difusas, como cor atrás de vidro fosco.
     São gradientes (sem desfoque) e a troca e o movimento mexem só em opacidade e posição,
     o que a placa de vídeo faz sem redesenhar: fica leve até no Dell. */
  .glow {
    position: fixed; inset: 0; overflow: hidden; pointer-events: none;
    opacity: 0; transition: opacity 2200ms var(--ease);
  }
  body.playing .glow.on { opacity: var(--glow-opacity); }  /* só na tela da música */
  .glow i {
    position: absolute; width: 110vmax; height: 110vmax; border-radius: 50%;
    background: radial-gradient(closest-side, var(--c), transparent);
    animation: 50s ease-in-out infinite alternate;
  }
  .glow i:nth-child(1) { left: -38vmax; top: -48vmax; animation-name: drift1; animation-duration: 47s; }
  .glow i:nth-child(2) { right: -42vmax; top: -22vmax; animation-name: drift2; animation-duration: 59s; }
  .glow i:nth-child(3) { left: -5vmax; bottom: -62vmax; animation-name: drift3; animation-duration: 53s; }
  .glow:not(.on) i, html.still .glow i { animation-play-state: paused; }
  @keyframes drift1 { to { transform: translate(22vmax, 14vmax) scale(1.1); } }
  @keyframes drift2 { to { transform: translate(-18vmax, 20vmax) scale(.92); } }
  @keyframes drift3 { to { transform: translate(16vmax, -16vmax) scale(1.08); } }

  #now {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 7vmin;
    padding: 7vmin 8vmin;
  }
  #sleeve {
    position: relative;
    width: min(44vw, 76vh); aspect-ratio: 1;
    border-radius: .6vmin;
    box-shadow: 0 3vmin 8vmin -2vmin var(--shadow);
    overflow: hidden;
    background: var(--faint);
  }
  #sleeve img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 1000ms var(--ease);
  }
  #sleeve img.on { opacity: 1; }
  #sleeve::after {
    content: ""; position: absolute; inset: 0; background: var(--veil);
    opacity: 0; transition: opacity 600ms var(--ease);
  }
  #sleeve.paused::after { opacity: 1; }
  #pause {
    position: absolute; left: 50%; top: 50%; z-index: 1;
    width: 11vmin; height: 11vmin; margin: -5.5vmin 0 0 -5.5vmin;
    color: var(--ink); opacity: 0; transform: scale(.9);
    transition: opacity 600ms var(--ease), transform 600ms var(--ease);
  }
  #sleeve.paused #pause { opacity: .9; transform: none; }

  #info {
    min-width: 0; max-width: 56ch;
    transition: opacity 280ms var(--ease), transform 280ms var(--ease);
  }
  #info.swap { opacity: 0; transform: translateY(1.2vmin); }
  #title {
    margin: 0; font-size: clamp(28px, 6.4vmin, 84px); font-weight: 650; font-stretch: 88%;
    line-height: 1.02; letter-spacing: -.02em;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  #artists { margin: 1.6vmin 0 0; font-size: clamp(16px, 3.1vmin, 40px); font-weight: 420; line-height: 1.15; }
  #album { margin: .8vmin 0 0; font-size: clamp(13px, 2vmin, 26px); font-weight: 380; color: var(--muted); }

  /* Letra: só ocupa espaço quando existe */
  #lyrics {
    display: grid; grid-template-rows: 0fr; opacity: 0;
    transition: grid-template-rows 800ms var(--ease), opacity 800ms var(--ease), margin 800ms var(--ease);
    margin-top: 0;
  }
  #lyrics.has { grid-template-rows: 1fr; opacity: 1; margin-top: 3.6vmin; }
  #lyrics .window {
    --line: clamp(18px, 3.3vmin, 42px);
    overflow: hidden; min-height: 0; height: calc(var(--line) * 5.6);
    -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
            mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
  }
  #lyrics ol {
    position: relative;  /* offsetTop das linhas é medido a partir daqui */
    list-style: none; margin: 0; padding: 0;
    transition: transform 700ms var(--ease);
  }
  #lyrics li {
    font-size: var(--line); line-height: 1.22; font-weight: 450; padding: .14em 0;
    opacity: .3; transition: opacity 500ms var(--ease);
  }
  #lyrics li.cur { opacity: 1; font-weight: 560; }
  #lyrics li.gap::before { content: "\266A"; }

  #foot { position: relative; display: flex; align-items: center; gap: 2vmin; margin-top: 4vmin; }
  #source { width: clamp(18px, 3vmin, 34px); height: clamp(18px, 3vmin, 34px); flex: none; }
  #source.spotify { color: var(--spotify); }
  #source.mic { color: var(--rust); }
  #device {
    position: absolute; left: 0; top: 100%; margin-top: 1.2vmin; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: clamp(12px, 1.9vmin, 24px); color: var(--muted);
  }
  #device:empty { display: none; }
  #progress { flex: 1; min-width: 0; transition: opacity 400ms var(--ease); }
  #progress.hidden { display: none; }
  .track { height: .5vmin; min-height: 3px; background: var(--faint); border-radius: 99px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--ink); border-radius: 99px; opacity: .85; }
  .times {
    display: flex; justify-content: space-between; margin-top: 1vmin;
    font-size: clamp(11px, 1.6vmin, 20px); color: var(--muted); font-variant-numeric: tabular-nums;
  }

  /* ---------- Espera ---------- */

  #idle { display: grid; place-items: center; }
  #idle .body { transition: opacity 900ms var(--ease), filter 900ms var(--ease); }
  body.listening #idle .body, body.listening #clock { opacity: .35; filter: blur(.4vmin); }
  #clock {
    position: absolute; top: 5.5vmin; left: 0; right: 0; text-align: center;
    font-size: clamp(22px, 5.2vmin, 64px); font-weight: 250; font-stretch: 80%; letter-spacing: .02em;
    color: var(--muted); font-variant-numeric: tabular-nums;
    transition: opacity 900ms var(--ease), filter 900ms var(--ease);
  }
  #recent { display: flex; justify-content: center; gap: 2.8vmin; width: 100%; padding: 0 4vw; }
  #recent figure { margin: 0; width: min(17vw, 27vh); min-width: 0; }
  #recent img {
    display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: .5vmin; box-shadow: 0 1.6vmin 4vmin -1.4vmin var(--shadow); background: var(--faint);
  }
  #recent figcaption {
    margin-top: 1.4vmin; font-size: clamp(11px, 1.7vmin, 21px); font-weight: 420; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #recent figure.enter, #books figure.enter { animation: rise 1100ms var(--ease) both; animation-delay: calc(var(--i) * 110ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(2.4vmin); } to { opacity: 1; transform: none; } }

  /* Páginas da espera (músicas / leituras), uma sobre a outra, trocando a cada N segundos */
  #idle .body { display: grid; width: 100%; }
  .page {
    grid-area: 1 / 1; display: grid; place-items: center;
    opacity: 0; visibility: hidden; transition: opacity 600ms var(--ease), visibility 0s linear 600ms;
  }
  .page.on { opacity: 1; visibility: visible; transition: opacity 600ms var(--ease) 300ms, visibility 0s; }

  /* Leituras: capas em pé (livro) em vez de quadradas (disco); a barra marca o que está sendo lido */
  #books { display: flex; justify-content: center; align-items: flex-end; gap: 3.4vmin; width: 100%; padding: 0 4vw; }
  #books figure { margin: 0; width: min(13vw, 22vh); min-width: 0; }
  #books img {
    display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover;
    border-radius: .3vmin .7vmin .7vmin .3vmin; box-shadow: 0 1.6vmin 4vmin -1.4vmin var(--shadow); background: var(--faint);
  }
  #books .track { margin-top: 1.4vmin; }
  #books .track i { display: block; height: 100%; background: var(--rust); border-radius: 99px; }
  #books figcaption {
    margin-top: 1.2vmin; font-size: clamp(11px, 1.7vmin, 21px); font-weight: 420; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Marcações sobre a capa (lendo / lido / favorito), como adesivos no canto */
  #books .cover { position: relative; }
  #books .marks { position: absolute; top: 1vmin; right: 1vmin; display: flex; gap: .7vmin; }
  #books .marks svg {
    width: clamp(18px, 3.4vmin, 40px); height: clamp(18px, 3.4vmin, 40px); padding: .75vmin; box-sizing: border-box;
    border-radius: 50%; background: var(--veil); color: var(--ink);
    -webkit-backdrop-filter: blur(1vmin); backdrop-filter: blur(1vmin); box-shadow: 0 .4vmin 1.2vmin -.4vmin var(--shadow);
  }
  #books .marks .reading, #books .marks .favorite { color: var(--rust); }
  #p-books { grid-template-rows: auto auto; align-content: center; }
  #pages-read {
    margin-top: 6vmin; text-align: center; color: var(--muted);
    font-size: clamp(13px, 2.2vmin, 26px); font-weight: 380; font-variant-numeric: tabular-nums;
  }
  #pages-read b {
    margin-right: 1.2vmin; color: var(--ink);
    font-size: clamp(22px, 5.2vmin, 64px); font-weight: 250; font-stretch: 80%; letter-spacing: .01em;
  }
  #pages-read.hidden { display: none; }

  #empty { width: 13vmin; height: 13vmin; color: var(--muted); opacity: .45; }
  #empty.hidden { display: none; }

  #status {
    position: absolute; bottom: 4.5vmin; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 3vmin;
    transition: opacity 900ms var(--ease);
  }
  #status .g { width: clamp(14px, 2.4vmin, 28px); height: clamp(14px, 2.4vmin, 28px); color: var(--muted); opacity: .4; transition: color .6s, opacity .6s; }
  #status .g.ok { opacity: 1; }
  #st-spotify.ok { color: var(--spotify); }
  #st-server { width: clamp(7px, 1.1vmin, 13px); height: clamp(7px, 1.1vmin, 13px); border-radius: 50%; background: var(--muted); opacity: .4; transition: background .6s, opacity .6s; }
  #st-server.ok { background: var(--spotify); opacity: .9; }
  #st-server.bad { background: var(--rust); opacity: 1; }
  #st-spotify.bad { color: var(--rust); opacity: 1; }

  /* ---------- Ouvindo música... ---------- */

  #listening {
    position: absolute; inset: 0; display: grid; place-items: center;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 700ms var(--ease), visibility 0s linear 700ms;
  }
  #listening.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  #listening .panel {
    display: grid; justify-items: center; gap: 3.4vmin; padding: 7vmin 9vmin; border-radius: 4vmin;
    background: var(--veil); box-shadow: 0 4vmin 12vmin -3vmin var(--shadow);
    -webkit-backdrop-filter: blur(2.4vmin); backdrop-filter: blur(2.4vmin);
    transform: scale(.96); transition: transform 900ms var(--ease);
  }
  #listening.on .panel { transform: none; }
  .bars { display: flex; align-items: center; gap: 1.2vmin; height: 12vmin; color: var(--rust); }
  .bars i {
    display: block; width: 1.1vmin; min-width: 5px; height: 100%; border-radius: 99px; background: currentColor;
    transform: scaleY(.18); animation: wave 1.5s ease-in-out infinite;
    animation-duration: calc(1.05s + var(--d) * .09s); animation-delay: calc(var(--d) * -.17s);
  }
  @keyframes wave { 0%, 100% { transform: scaleY(.18); } 50% { transform: scaleY(1); } }
  #listening p { margin: 0; font-size: clamp(18px, 4vmin, 48px); font-weight: 400; font-stretch: 90%; letter-spacing: -.005em; }
  #timer { font-size: clamp(16px, 3.2vmin, 40px); font-weight: 300; color: var(--muted); font-variant-numeric: tabular-nums; }

  @media (max-aspect-ratio: 1/1) {
    #now { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; justify-items: center; text-align: center; gap: 5vmin; }
    #sleeve { width: min(78vw, 42vh); }
    #info { max-width: 90vw; }
    #foot { flex-direction: column; }
    #recent, #books { flex-wrap: wrap; }
    #recent figure { width: min(26vw, 18vh); }
    #books figure { width: min(22vw, 14vh); }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --fade: 200ms; }
    .bars i { animation: none; transform: scaleY(.6); }
    .glow i { animation: none; }
    #recent figure.enter, #books figure.enter { animation: none; }
    * { transition-duration: 200ms !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-spotify" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="12" fill="currentColor"/>
    <g fill="none" stroke="var(--bg)" stroke-width="1.9" stroke-linecap="round">
      <path d="M5.4 8.7c4.6-1.4 9.5-.9 13.5 1.5"/>
      <path d="M6.1 12.3c3.8-1.1 7.8-.7 11.2 1.2"/>
      <path d="M6.9 15.7c3-.8 5.9-.5 8.4 1"/>
    </g>
  </symbol>
  <symbol id="i-mic" viewBox="0 0 24 24">
    <rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/>
    <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-pause" viewBox="0 0 24 24">
    <rect x="5" y="3.5" width="5" height="17" rx="1.6" fill="currentColor"/>
    <rect x="14" y="3.5" width="5" height="17" rx="1.6" fill="currentColor"/>
  </symbol>
  <symbol id="i-vinyl" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.1">
      <circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="12" r="7" opacity=".6"/><circle cx="12" cy="12" r="3.2"/>
    </g>
    <circle cx="12" cy="12" r=".9" fill="currentColor"/>
  </symbol>
  <symbol id="i-reading" viewBox="0 0 24 24">
    <path d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5 2-1.5 5-2 9-1.5V5c-4-.5-7 0-9 1.5Zm0 0v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-read" viewBox="0 0 24 24">
    <path d="m4.5 12.5 4.8 4.8L19.5 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-favorite" viewBox="0 0 24 24">
    <path d="M12 20.5S3 15 3 8.9A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 9 2.3c0 6.1-9 11.6-9 11.6Z" fill="currentColor"/>
  </symbol>
</svg>

<div class="glow" id="glow0"><i></i><i></i><i></i></div>
<div class="glow" id="glow1"><i></i><i></i><i></i></div>

<section id="now" class="view" aria-live="polite">
  <div id="sleeve">
    <img id="cover0" alt=""><img id="cover1" alt="">
    <svg id="pause"><use href="#i-pause"/></svg>
  </div>
  <div id="info">
    <h1 id="title"></h1>
    <p id="artists"></p>
    <p id="album"></p>
    <div id="lyrics"><div class="window"><ol id="lines"></ol></div></div>
    <div id="foot">
      <svg id="source"><use href="#i-spotify"/></svg>
      <span id="device"></span>
      <div id="progress">
        <div class="track"><div id="bar"></div></div>
        <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      </div>
    </div>
  </div>
</section>

<section id="idle" class="view">
  <div id="clock">--:--</div>
  <div class="body">
    <div class="page on" id="p-music">
      <div id="recent"></div>
      <svg id="empty" class="hidden"><use href="#i-vinyl"/></svg>
    </div>
    <div class="page" id="p-books">
      <div id="books"></div>
      <div id="pages-read" class="hidden"><b></b><span></span></div>
    </div>
  </div>
  <div id="status">
    <svg id="st-spotify" class="g"><use href="#i-spotify"/></svg>
    <span id="st-server"></span>
  </div>
</section>

<div id="listening" aria-live="polite">
  <div class="panel">
    <div class="bars" aria-hidden="true">
      <i style="--d:3"></i><i style="--d:6"></i><i style="--d:1"></i><i style="--d:8"></i><i style="--d:4"></i>
      <i style="--d:9"></i><i style="--d:2"></i><i style="--d:7"></i><i style="--d:5"></i>
    </div>
    <p>Ouvindo música...</p>
    <span id="timer">0:00</span>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const IDLE_AFTER_PAUSE_MS = 30000;   // pausado por mais que isso → tela de espera
// Horários do tema (padrão 19:30 e 08:00); o servidor manda os do painel no evento "settings"
let NIGHT_FROM = 19 * 60 + 30;
let DAY_FROM = 8 * 60;
const toMinutes = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };

let track = null;                    // último estado vindo do servidor
let fetchedAt = 0;                   // quando chegou, para avançar a barra localmente
let pausedSince = null;
let listening = { active: false };
let listenBase = 0;
let lyricsLines = null, lyricsFor = null, lyricsTimer = null, curLine = -2;

const fmt = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

/* ---------- Dia e noite ---------- */

function applyTheme() {
  const forced = new URLSearchParams(location.search).get("theme");
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  const night = forced ? forced === "night"
    : NIGHT_FROM > DAY_FROM ? (m >= NIGHT_FROM || m < DAY_FROM) : (m >= NIGHT_FROM && m < DAY_FROM);
  const theme = night ? "night" : "day";
  if (document.documentElement.dataset.theme === theme) return;
  document.documentElement.dataset.theme = theme;
  paintGlow($(`glow${glowSlot}`), glowColors);  // as cores da capa também mudam de tom
}

function tickClock() {
  $("clock").textContent = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

/* ---------- Capa (troca com cruzamento suave) ---------- */

let coverUrl = null, coverSlot = 0;

function setCover(url) {
  if (url === coverUrl) return;
  coverUrl = url;
  const next = 1 - coverSlot;
  loadGlow(url);
  if (!url) {
    $(`cover${coverSlot}`).classList.remove("on");
    return;
  }
  const probe = new Image();
  probe.onerror = () => { if (url === coverUrl) setCover(null); };  // capa não carregou: sem imagem velha
  probe.onload = () => {
    if (url !== coverUrl) return;
    $(`cover${next}`).src = url;
    $(`cover${next}`).classList.add("on");
    $(`cover${coverSlot}`).classList.remove("on");
    coverSlot = next;
  };
  probe.src = url;
}

/* ---------- Fundo com as cores da capa ---------- */

let glowOn = true, glowSlot = 0, glowColors = null, glowFor = null;

// As cores vêm do servidor (o navegador não pode ler os pixels de uma capa de outro site)
async function loadGlow(url) {
  glowFor = url;
  let colors = null;
  if (url && glowOn) {
    try {
      const r = await fetch(`/api/palette?url=${encodeURIComponent(url)}`);
      if (r.ok) colors = (await r.json()).colors;
    } catch { /* sem cores: fica o fundo normal */ }
  }
  if (glowFor !== url) return;  // a música já trocou de novo
  showGlow(colors);
}

function showGlow(colors) {
  glowColors = colors;
  const next = 1 - glowSlot;
  $(`glow${glowSlot}`).classList.remove("on");
  if (colors) { paintGlow($(`glow${next}`), colors); $(`glow${next}`).classList.add("on"); }
  glowSlot = next;
}

function paintGlow(el, colors) {
  if (!colors) return;
  const night = document.documentElement.dataset.theme === "night";
  el.querySelectorAll("i").forEach((spot, i) => spot.style.setProperty("--c", tone(colors[i % colors.length], night)));
}

// Ajusta a cor ao tema: de dia, clara e suave sobre o bege; à noite, escura e funda (o texto continua legível)
function tone(hex, night) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0, s = 0, l = (max + min) / 2;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  const clamp = (x, a, z) => Math.min(z, Math.max(a, x));
  s = s < .08 ? s : clamp(s, .3, night ? .6 : .7);  // cinza continua cinza
  l = night ? clamp(l, .16, .3) : clamp(l, .52, .7);
  return `hsl(${Math.round((h + 360) % 360)} ${Math.round(s * 100)}% ${Math.round(l * 100)}%)`;
}

/* ---------- Tocando agora ---------- */

function fillInfo(d) {
  $("title").textContent = d.title;
  $("artists").textContent = d.artists.join(", ");
  $("album").textContent = [d.album, d.release_date && d.release_date.slice(0, 4)].filter(Boolean).join(" · ");
  const mic = d.source === "mic";
  $("source").setAttribute("class", mic ? "mic" : "spotify");
  $("source").firstElementChild.setAttribute("href", mic ? "#i-mic" : "#i-spotify");
  $("device").textContent = mic ? "" : d.device || "";  // microfone já tem o ícone próprio
  $("progress").classList.toggle("hidden", !d.duration_ms);
  $("duration").textContent = d.duration_ms ? fmt(d.duration_ms) : "";
}

let swapTimer = null;
function swapInfo(d, animate) {
  clearTimeout(swapTimer);
  if (!animate) { fillInfo(d); return; }
  $("info").classList.add("swap");
  swapTimer = setTimeout(() => { fillInfo(d); $("info").classList.remove("swap"); }, 300);
}

function applyNow(d) {
  ready = true;
  if (!d.title) { track = null; pausedSince = null; lyricsFor = null; setLyrics(null); updateView(); return; }
  const changed = !track || track.id !== d.id;
  // O servidor diz há quanto tempo está pausada (vale também ao recarregar a página)
  pausedSince = d.playing ? null : Date.now() - (d.paused_ms || 0);
  track = d;
  fetchedAt = Date.now();
  $("sleeve").classList.toggle("paused", !d.playing);
  if (!changed && d.source !== "mic") $("device").textContent = d.device || "";
  if (changed) {
    setCover(d.cover);
    swapInfo(d, $("now").classList.contains("on"));
    if (d.source === "spotify") loadLyrics(d); else { lyricsFor = null; setLyrics(null); }
  }
  renderProgress();
  updateView();
}

function renderProgress() {
  if (!track || !track.duration_ms) return;
  const p = track.playing
    ? Math.min(track.duration_ms, track.progress_ms + (Date.now() - fetchedAt))
    : track.progress_ms;
  $("bar").style.width = `${(p / track.duration_ms) * 100}%`;
  $("elapsed").textContent = fmt(p);
  syncLyrics(p);
}

/* ---------- Letra sincronizada (só Spotify) ---------- */

function setLyrics(lines) {
  clearTimeout(lyricsTimer);
  lyricsLines = lines && lines.length ? lines : null;
  curLine = -2;
  const ol = $("lines");
  if (!lyricsLines) {
    $("lyrics").classList.remove("has");
    setTimeout(() => { if (!lyricsLines) ol.replaceChildren(); }, 900);
    return;
  }
  ol.replaceChildren(...lyricsLines.map((l) => {
    const li = document.createElement("li");
    li.textContent = l.text;
    if (!l.text) li.className = "gap";
    return li;
  }));
  $("lyrics").classList.add("has");
  if (track) syncLyrics(Math.min(track.duration_ms, track.progress_ms + (Date.now() - fetchedAt)));
}

function loadLyrics(d, attempt = 0) {
  lyricsFor = d.id;
  setLyrics(null);
  fetch(`/api/lyrics?track=${encodeURIComponent(d.id)}`)
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((j) => { if (lyricsFor === d.id) setLyrics(j.lines); })
    .catch(() => {
      if (lyricsFor === d.id && attempt < 3) lyricsTimer = setTimeout(() => loadLyrics(d, attempt + 1), 20000);
    });
}

function syncLyrics(progressMs) {
  if (!lyricsLines) return;
  const t = progressMs + 250;  // acende um instante antes
  let lo = 0, hi = lyricsLines.length - 1, idx = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (lyricsLines[mid].t <= t) { idx = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (idx === curLine) return;
  curLine = idx;
  const items = $("lines").children;
  for (let i = 0; i < items.length; i++) items[i].classList.toggle("cur", i === idx);
  centerLyrics();
}

function centerLyrics() {
  const items = $("lines").children;
  const el = items[Math.max(0, curLine)];
  if (!el) return;
  const win = $("lines").parentElement.clientHeight;
  $("lines").style.transform = `translateY(${win / 2 - (el.offsetTop + el.offsetHeight / 2)}px)`;
}
addEventListener("resize", centerLyrics);

/* ---------- Visões ---------- */

let ready = false;   // só mostra uma visão depois do primeiro estado do servidor (evita piscar a espera)
setTimeout(() => { ready = true; updateView(); }, 2500);

function updateView() {
  if (!ready) return;
  const showNow = !!track && (track.playing || (pausedSince !== null && Date.now() - pausedSince <= IDLE_AFTER_PAUSE_MS));
  $("now").classList.toggle("on", showNow);
  $("idle").classList.toggle("on", !showNow);
  document.body.classList.toggle("playing", showNow);
  const listen = !showNow && listening.active;
  $("listening").classList.toggle("on", listen);
  document.body.classList.toggle("listening", listen);
}

function renderTimer() {
  if (listening.active) $("timer").textContent = fmt(performance.now() - listenBase);
}

/* ---------- Espera: as 5 últimas músicas ---------- */

let recentKey = "";
async function refreshRecent() {
  let items;
  try { items = await fetch("/api/recent?limit=5").then((r) => r.json()); } catch { return; }
  const key = items.map((i) => i.cover).join("|");
  $("empty").classList.toggle("hidden", items.length > 0);
  if (key === recentKey) return;
  recentKey = key;
  $("recent").replaceChildren(...items.map((it, i) => {
    const fig = document.createElement("figure");
    fig.className = "enter"; fig.style.setProperty("--i", i);
    const img = document.createElement("img"); img.src = it.cover; img.alt = "";
    const cap = document.createElement("figcaption"); cap.textContent = it.title;
    fig.append(img, cap);
    return fig;
  }));
}

/* ---------- Espera: leituras do Hardcover, alternando com as músicas ---------- */

let booksKey = null, booksOn = true, rotateMs = 10000, rotateTimer, page = "music";

function renderBooks(data) {
  const items = [...data.reading, ...data.read].filter((b) => b.cover);
  const total = data.pages_read || 0;
  const key = items.map((b) => `${b.id}:${b.progress ?? ""}:${b.status}:${b.favorite}`).join("|") + `#${total}`;
  if (key === booksKey) return;
  booksKey = key;
  $("pages-read").classList.toggle("hidden", !total);
  $("pages-read").querySelector("b").textContent = total.toLocaleString("pt-BR");
  $("pages-read").querySelector("span").textContent = total === 1 ? "página lida" : "páginas lidas";
  $("books").replaceChildren(...items.map((b, i) => {
    const fig = document.createElement("figure");
    fig.style.setProperty("--i", i);
    const cover = document.createElement("div"); cover.className = "cover";
    const img = document.createElement("img"); img.src = b.cover; img.alt = "";
    const marks = document.createElement("div"); marks.className = "marks";
    const kinds = [b.reading ? "reading" : b.status === "read" ? "read" : null, b.favorite ? "favorite" : null];
    for (const kind of kinds.filter(Boolean)) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.classList.add(kind);
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", `#i-${kind}`);
      svg.append(use); marks.append(svg);
    }
    cover.append(img, marks);
    fig.append(cover);
    // A barra de progresso só aparece em "lendo"; nos lidos fica invisível para alinhar as capas
    const track = document.createElement("div"); track.className = "track";
    const fill = document.createElement("i"); fill.style.width = `${Math.round((b.progress || 0) * 100)}%`;
    if (!b.reading) track.style.visibility = "hidden";
    track.append(fill); fig.append(track);
    const cap = document.createElement("figcaption"); cap.textContent = b.title;
    fig.append(cap);
    return fig;
  }));
  if (!items.length && page === "books") showPage("music");
}

function showPage(name) {
  page = name;
  $("p-music").classList.toggle("on", name === "music");
  $("p-books").classList.toggle("on", name === "books");
  // As capas da página que entra sobem de novo, em sequência
  for (const fig of $(name === "music" ? "recent" : "books").children) {
    fig.classList.remove("enter"); void fig.offsetWidth; fig.classList.add("enter");
  }
}

function rotate() {
  const hasBooks = booksOn && $("books").children.length > 0;
  const visible = $("idle").classList.contains("on") && !listening.active;
  if (!hasBooks) { if (page !== "music") showPage("music"); return; }
  if (visible) showPage(page === "music" ? "books" : "music");
}

function scheduleRotate() {
  clearInterval(rotateTimer);
  rotateTimer = setInterval(rotate, rotateMs);
}

async function refreshStatus() {
  try {
    const s = await fetch("/api/status").then((r) => r.json());
    const ok = s.spotify_authorized && !s.last_error;
    $("st-spotify").setAttribute("class", `g ${ok ? "ok" : "bad"}`);
  } catch {
    $("st-spotify").setAttribute("class", "g");
  }
}

/* ---------- Tempo real ---------- */

let appVersion = null;
function connect() {
  const es = new EventSource("/api/stream");
  // Deploy novo (os arquivos da tela mudaram): recarrega sozinha, sem mexer no tablet
  es.addEventListener("version", (e) => {
    const v = JSON.parse(e.data);
    if (appVersion && v !== appVersion) location.reload();
    appVersion = v;
  });
  es.addEventListener("open", () => { $("st-server").className = "ok"; refreshStatus(); refreshRecent(); });
  es.addEventListener("now", (e) => applyNow(JSON.parse(e.data)));
  es.addEventListener("listening", (e) => {
    listening = JSON.parse(e.data);
    listenBase = performance.now() - (listening.elapsed_ms || 0);
    renderTimer();
    updateView();
  });
  es.addEventListener("history", refreshRecent);
  es.addEventListener("settings", (e) => {
    const s = JSON.parse(e.data);
    NIGHT_FROM = toMinutes(s.night_from);
    DAY_FROM = toMinutes(s.day_from);
    applyTheme();
    booksOn = s.books_enabled;
    document.documentElement.classList.toggle("still", !s.cover_motion);
    if (s.cover_colors !== glowOn) { glowOn = s.cover_colors; loadGlow(coverUrl); }
    if (s.idle_rotate_seconds * 1000 !== rotateMs) { rotateMs = s.idle_rotate_seconds * 1000; scheduleRotate(); }
    if (!booksOn && page === "books") showPage("music");
  });
  es.addEventListener("books", (e) => renderBooks(JSON.parse(e.data)));
  es.addEventListener("error", () => { $("st-server").className = "bad"; });
}

applyTheme(); tickClock();
connect();
setInterval(applyTheme, 20000);
setInterval(tickClock, 1000);
setInterval(renderProgress, 250);
setInterval(renderTimer, 250);
setInterval(updateView, 1000);       // passa para a espera quando a pausa ultrapassa 30 s
setInterval(refreshStatus, 15000);
scheduleRotate();
</script>
</body>
